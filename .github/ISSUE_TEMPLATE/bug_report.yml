name: Bug report
description: Report reproducible incorrect behaviour
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: behaviour
    attributes:
      label: Observed behaviour
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest repeatable sequence. Remove tokens, secrets, and personal data.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local
        - Hosted
        - Both
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Use a private security advisory instead if the report exposes a vulnerability.
